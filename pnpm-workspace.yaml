allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  postcss: "^8.5.10"
  "@hono/node-server": "^1.19.13"
  uuid: "^11.1.1"
  # Security floors for transitive deps (CVE fixes; see osv-scanner findings).
  hono: "^4.12.25" # GHSA-88fw-hqm2-52qc et al. (via @prisma/dev, dev-only)
  js-yaml: "^4.2.0" # GHSA-h67p-54hq-rp68 (via eslint, dev-only)
  esbuild: "^0.28.1" # GHSA-g7r4-m6w7-qqqr (via vite/tsx, dev-only)
  vite: "^8.0.16" # GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3 (via vitest, dev-only)

peerDependencyRules:
  allowedVersions:
    "next-auth>nodemailer": "9"
