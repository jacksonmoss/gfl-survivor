allowBuilds:
  '@prisma/engines': true
  esbuild: true
  prisma: true
  sharp: true
  unrs-resolver: true

overrides:
  postcss: "^8.5.23" # GHSA-fxqj-rqcc-2cmp (sourceMappingURL arbitrary .map read; build-only)
  "@hono/node-server": "^2.0.5" # GHSA-frvp-7c67-39w9 (via @prisma/dev, dev-only)
  uuid: "^11.1.1"
  # Security floors for transitive deps (CVE fixes; see osv-scanner findings).
  hono: "^4.12.25" # GHSA-88fw-hqm2-52qc et al. (via @prisma/dev, dev-only)
  js-yaml: "^4.2.0" # GHSA-h67p-54hq-rp68 (via eslint, dev-only)
  esbuild: "^0.28.1" # GHSA-g7r4-m6w7-qqqr (via vite/tsx, dev-only)
  vite: "^8.0.16" # GHSA-fx2h-pf6j-xcff, GHSA-v6wh-96g9-6wx3 (via vitest, dev-only)
  fast-uri: "^3.1.5" # GHSA-v2hh-gcrm-f6hx, GHSA-7p8r-x3mc-p8w7 (via prisma > ajv, dev-only)
  find-my-way: "^9.7.0" # GHSA-c96f-x56v-gq3h (via @prisma/dev, dev-only)
  valibot: "^1.4.2" # GHSA-5qjj-4xww-7phc (via @prisma/dev, dev-only)
  # 1.1.17/1.1.18 are 1.x backports, so this line now covers all three known
  # brace-expansion DoS advisories *without* leaving minimatch@3's CJS
  # `require('brace-expansion')` — the reason the 5.0.8 (ESM-only) "fix" was
  # unusable and GHSA-mh99-v99m-4gvg was suppressed in osv-scanner.toml instead.
  # That suppression is now gone; keep this at >= 1.1.18.
  brace-expansion: "^1.1.18" # GHSA-3jxr-9vmj-r5cp, GHSA-mh99-v99m-4gvg, GHSA-rgw5-rvv9-x895 (via eslint > minimatch, dev-only)
  sharp: "^0.35.0" # GHSA-f88m-g3jw-g9cj / libvips CVEs (via next image optimization)

peerDependencyRules:
  allowedVersions:
    "next-auth>nodemailer": "9"
