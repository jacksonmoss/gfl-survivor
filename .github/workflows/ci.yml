name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

env:
  # Dummy values — Next.js/Prisma read these at build time but no live DB or auth is needed for CI.
  DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
  NEXTAUTH_URL: http://localhost:3000

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.x

      # Generated and masked at runtime so no secret-shaped string ever appears
      # in the workflow source or step logs (plain `env:` values print in full).
      - name: Generate dummy NextAuth secret
        run: |
          secret="$(openssl rand -base64 32)"
          echo "::add-mask::$secret"
          echo "NEXTAUTH_SECRET=$secret" >> "$GITHUB_ENV"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.x
        with:
          node-version: 20
          cache: npm

      - name: Cache Next.js build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.x
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**/*.[jt]s', 'src/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Install dependencies
        # next-auth@4 declares a peer dep on nodemailer@^7, but the project pins
        # nodemailer@8.0.10 (see commit fd72704) — same conflict exists locally.
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
