# Production stack: Postgres + one-shot migrator + app behind an nginx proxy.
# Configure via a .env file next to this one (see .env.prod.example).
#
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
#
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-gfl}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-gfl}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-gfl} -d ${POSTGRES_DB:-gfl}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Applies pending migrations, then exits. The app waits for it to succeed.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    # Tagged so the `reminders` sidecar can reuse the exact same image.
    image: gfl-survivor-app:latest
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      NEXTAUTH_URL: ${NEXTAUTH_URL:?set NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:?set NEXTAUTH_SECRET}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      # Shared secret the reminders sidecar authenticates with. Without it the
      # reminders endpoint returns 503 and no reminders are sent.
      CRON_SECRET: ${CRON_SECRET:-}
      REMINDER_LEAD_HOURS: ${REMINDER_LEAD_HOURS:-}
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    expose:
      - "3000"
    # The runner image is Node-only (no curl), so probe with node's fetch.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN}
      # Only substitute ${DOMAIN} in the template; leave nginx's own $vars alone.
      NGINX_ENVSUBST_FILTER: DOMAIN
    volumes:
      - ./deploy/nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
      - certbot_certs:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    # Reload every 6h so renewed certs are picked up without a restart.
    command: /bin/sh -c "while :; do sleep 6h & wait $${!}; nginx -s reload; done & nginx -g 'daemon off;'"
    depends_on:
      app:
        condition: service_healthy

  # Scheduled pg_dump of the database into ./backups (a host bind mount, so
  # dumps survive loss of the pgdata volume). Reuses the postgres image — no new
  # dependency. Interval + retention are tunable; see deploy/backup.sh.
  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER:-gfl}
      PGDATABASE: ${POSTGRES_DB:-gfl}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-86400}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    volumes:
      - ./deploy/backup.sh:/usr/local/bin/backup.sh:ro
      - ./backups:/backups
    entrypoint: ["/bin/sh", "/usr/local/bin/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Polls the pick-reminders endpoint on a schedule (default every 15 min).
  # Reuses the app image (no new dependency) and calls the app over the internal
  # network with the CRON_SECRET, so the secret never leaves the compose network.
  # The endpoint is idempotent and self-gates to slot windows, so frequent polls
  # are safe — it only emails when a reminder slot is actually due. No-ops
  # (returns 503) unless CRON_SECRET is set; needs SMTP configured to actually
  # email rather than log to the console. See deploy/reminders.sh.
  reminders:
    # Reuses the app image built above (no separate build) — the runner image is
    # Node-only, and the sidecar POSTs with node's global fetch (no curl needed).
    image: gfl-survivor-app:latest
    environment:
      APP_URL: http://app:3000
      # Optional: when unset the sidecar idles (logs a notice) instead of polling,
      # so the stack still comes up without reminders configured.
      CRON_SECRET: ${CRON_SECRET:-}
      REMINDER_INTERVAL: ${REMINDER_INTERVAL:-900}
    entrypoint: ["/bin/sh", "/usr/local/bin/reminders.sh"]
    volumes:
      - ./deploy/reminders.sh:/usr/local/bin/reminders.sh:ro
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy

  # Renews Let's Encrypt certificates. Bootstrap the first cert with
  # deploy/init-letsencrypt.sh; thereafter this attempts renewal twice a day
  # (certbot only acts when a cert is within 30 days of expiry).
  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot_certs:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    entrypoint: /bin/sh -c "trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;"

volumes:
  pgdata:
  certbot_certs:
  certbot_www:
