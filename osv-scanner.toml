# osv-scanner ignore list. Loaded automatically by the CI osv-scan job
# (google/osv-scanner-action, `osv-scanner -r ./`). Keep every entry justified
# and time-boxed via `ignoreUntil` so it gets re-reviewed rather than lingering.
#
# Currently empty — nothing is suppressed. Prefer bumping the security floor in
# pnpm-workspace.yaml `overrides:` over adding an entry here; only suppress when
# there is genuinely no toolchain-compatible fixed version.
#
# History: GHSA-mh99-v99m-4gvg (brace-expansion OOM DoS) lived here because its
# only fixed version at the time was 5.0.8, which is ESM-only and breaks the
# minimatch@3 that eslint pulls in. A 1.x backport (1.1.17) has since landed, so
# the override now pins >= 1.1.18 and the suppression was removed rather than
# renewed.
