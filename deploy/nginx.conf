# Reverse proxy for the GFL app container.
# TLS is intentionally omitted here — terminate HTTPS at this layer in a real
# deployment (e.g. add a 443 server block with certs, or front this with a
# managed load balancer / Cloudflare) and set NEXTAUTH_URL to the https origin.
server {
    listen 80;
    server_name _;

    # Live score polling is short-lived; a generous timeout is still helpful.
    proxy_read_timeout 60s;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # NextAuth trusts these to build absolute callback URLs behind a proxy.
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        # Allow WebSocket/upgrade requests to pass through.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}
